<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/long.jpg" />
    <link rel="preconnect" href="%VITE_BASE_URL%" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LONG Hub</title>
  </head>
  <body>
    <div id="root">
      <style>
        :root {
          color-scheme: light;
          --app-loader-bg: #ffffff;
          --app-loader-fg: #171717;
          --app-loader-muted: #737373;
          --app-loader-border: #e5e5e5;
          --app-loader-track: #fdfbfe;
        }

        @media (prefers-color-scheme: dark) {
          :root {
            color-scheme: dark;
            --app-loader-bg: #171717;
            --app-loader-fg: #fafafa;
            --app-loader-muted: #a3a3a3;
            --app-loader-border: #333333;
            --app-loader-track: #262626;
          }
        }

        html,
        body,
        #root {
          min-height: 100%;
          margin: 0;
        }

        .app-loader {
          min-height: 100vh;
          display: grid;
          place-items: center;
          background: var(--app-loader-bg);
          color: var(--app-loader-fg);
          font-family:
            Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
            "Segoe UI", sans-serif;
        }

        .app-loader__content {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 18px;
        }

        .app-loader__mark {
          width: 64px;
          height: 64px;
          display: grid;
          place-items: center;
          border: 1px solid var(--app-loader-border);
          border-radius: 16px;
          background: var(--app-loader-track);
          box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
        }

        .app-loader__mark img {
          width: 42px;
          height: 42px;
          border-radius: 12px;
          object-fit: cover;
        }

        .app-loader__spinner {
          width: 28px;
          height: 28px;
          border: 2px solid var(--app-loader-border);
          border-top-color: var(--app-loader-fg);
          border-radius: 999px;
          animation: app-loader-spin 0.8s linear infinite;
        }

        @keyframes app-loader-spin {
          to {
            transform: rotate(360deg);
          }
        }

        @media (prefers-reduced-motion: reduce) {
          .app-loader__spinner {
            animation: none;
          }
        }
      </style>
      <div class="app-loader" role="status" aria-live="polite">
        <div class="app-loader__content">
          <div class="app-loader__mark" aria-hidden="true">
            <img src="/long.jpg" alt="" />
          </div>
          <div class="app-loader__spinner" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
