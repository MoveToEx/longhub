version: "2"
sql:
  - engine: "postgresql"
    queries:
      - "sql/admin.sql"
      - "sql/appkey.sql"
      - "sql/deletion.sql"
      - "sql/favorite.sql"
      - "sql/image.sql"
      - "sql/search.sql"
      - "sql/sync.sql"
      - "sql/tag.sql"
      - "sql/upload.sql"
      - "sql/user.sql"
      - "sql/version.sql"
      - "sql/webauthn.sql"
      - "sql/webhook.sql"
    schema: "sql/schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        json_tags_case_style: "camel"
        emit_empty_slices: true
        overrides:
          - column: "webhook.header_templates"
            go_type:
              type: "map[string]string"
          - column: "user.preference"
            go_type:
              import: "long/internal/types"
              type: "Preference"
          - column: "webauthn_session.data"
            go_type:
              import: "github.com/go-webauthn/webauthn/webauthn"
              type: "SessionData"
