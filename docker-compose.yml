services:
  pg:
    image: postgres:18.4-alpine3.23
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=long
      - TZ=Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d long"]
      interval: 5s
      timeout: 30s
      retries: 30
  valkey:
    image: valkey/valkey:9.1.0-alpine3.23
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 30s
      retries: 30
      start_period: 1s
  meilisearch:
    image: getmeili/meilisearch:v1.45.2
    environment:
      - MEILI_MASTER_KEY=MASTER_KEY
    healthcheck:
      test: ["CMD-SHELL", "curl", "http://localhost:7700/health"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 30s
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      pg:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://user:password@pg/long
      - VALKEY_ADDR=valkey:6379
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_KEY=MASTER_KEY
      - GIN_MODE=release
    env_file: .env
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_BASE: ${API_BASE}
    ports:
      - "5173:80"
    environment:
      - NODE_ENV=PRODUCTION

volumes:
  pgdata: